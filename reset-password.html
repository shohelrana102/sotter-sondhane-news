<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নতুন পাসওয়ার্ড | সত্যের সন্ধানে সব সময়</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;padding:20px}
.box{max-width:400px;margin:70px auto;background:white;padding:25px;border-radius:12px}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box}
button{background:#087b43;color:white;border:0;border-radius:6px;font-size:16px}
#msg{color:#c00}
</style>
</head>
<body>
<div class="box">
<h2>নতুন পাসওয়ার্ড দিন</h2>
<p>আপনার অ্যাডমিন অ্যাকাউন্টের নতুন পাসওয়ার্ড লিখুন।</p>
<form id="resetForm">
<input id="password" type="password" placeholder="নতুন পাসওয়ার্ড" minlength="8" required>
<input id="confirm" type="password" placeholder="আবার পাসওয়ার্ড লিখুন" minlength="8" required>
<button type="submit">পাসওয়ার্ড পরিবর্তন করুন</button>
</form>
<p id="msg"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(
 window.PORTAL_CONFIG.SUPABASE_URL,
 window.PORTAL_CONFIG.SUPABASE_ANON_KEY
);
const form=document.getElementById("resetForm");
const msg=document.getElementById("msg");

form.addEventListener("submit",async function(e){
 e.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password!==confirm){msg.textContent="দুটি পাসওয়ার্ড এক নয়।";return;}
 msg.textContent="পরিবর্তন হচ্ছে...";
 const {error}=await db.auth.updateUser({password:password});
 if(error){msg.textContent="সমস্যা: "+error.message;return;}
 msg.style.color="green";
 msg.textContent="পাসওয়ার্ড পরিবর্তন হয়েছে। এখন অ্যাডমিন প্যানেলে লগইন করুন।";
 form.reset();
});
</script>
</body>
</html>
