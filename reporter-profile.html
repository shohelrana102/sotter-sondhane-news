<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সাংবাদিকের প্রোফাইল | সত্যের সন্ধানে সব সময়</title><style>body{font-family:Arial,sans-serif;background:#f2f6f3;color:#183528;margin:0;padding:16px}.card{max-width:680px;margin:25px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 3px 16px #0001;text-align:center}.card img{width:150px;height:150px;border-radius:50%;object-fit:cover}.detail{text-align:left;border-bottom:1px solid #eee;padding:10px}</style></head>
<body><main class="card"><h1>সাংবাদিকের পরিচিতি</h1><img id="photo" alt="সাংবাদিকের ছবি"><h2 id="name">লোড হচ্ছে...</h2><div id="details"></div><p><a href="/">মূল নিউজ পোর্টালে ফিরুন</a></p></main>
<script>
(async()=>{try{const id=new URLSearchParams(location.search).get("id");const r=await fetch("/api/public-reporter-profile?id="+encodeURIComponent(id||""));const d=await r.json();if(!r.ok)throw new Error(d.error||"তথ্য পাওয়া যায়নি");const p=d.profile;document.querySelector("#photo").src=p.photo_url||"";document.querySelector("#name").textContent=p.full_name||"নাম নেই";const box=document.querySelector("#details");for(const [k,v] of [["পদ",p.reporter_post],["ফোন",p.phone],["ইমেইল",p.email],["ঠিকানা",p.address]]){const el=document.createElement("p");el.className="detail";el.textContent=k+": "+(v||"দেওয়া হয়নি");box.append(el);}}catch(e){document.querySelector("#name").textContent=e.message;}})();
</script></body></html>
