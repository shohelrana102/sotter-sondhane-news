<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সাংবাদিক | সত্যের সন্ধানে সব সময়</title><style>body{font-family:Arial,sans-serif;background:#f2f6f3;color:#183528;margin:0;padding:16px}.card{max-width:620px;margin:25px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 3px 16px #0001}a{color:#176b43}</style></head>
<body><main class="card"><h2 id="name">সাংবাদিকের নাম লোড হচ্ছে...</h2><p><a href="/">মূল নিউজ পোর্টালে ফিরুন</a></p></main>
<script>(async()=>{try{const id=new URLSearchParams(location.search).get("id");const r=await fetch("/api/public-reporter-profile?id="+encodeURIComponent(id||""));const d=await r.json();if(!r.ok)throw new Error(d.error||"তথ্য পাওয়া যায়নি");document.querySelector("#name").textContent="সাংবাদিক: "+(d.profile.full_name||"নাম নেই");}catch(e){document.querySelector("#name").textContent=e.message;}})();</script></body></html>
