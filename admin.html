<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন ড্যাশবোর্ড</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap top"><div class="brand">অ্যাডমিন ড্যাশবোর্ড</div><form method="post" action="/admin/logout"><button class="secondary">লগআউট</button></form></div></header><main class="wrap"><p>নিউজ অনুমোদন করলে মূল ওয়েবসাইটে প্রকাশিত হবে। অপ্রাসঙ্গিক বা কপি নিউজ বাতিল/ডিলিট করুন।</p><div id="items">লোড হচ্ছে...</div></main><script>
async function load(){const r=await fetch('/api/admin/news');if(!r.ok){location.href='/admin/login';return;}const items=await r.json(),el=document.getElementById('items');el.innerHTML='';if(!items.length){el.textContent='কোনো নিউজ জমা নেই।';return;}for(const n of items){const c=document.createElement('article');c.className='news adminitem';const h=document.createElement('h3');h.textContent=n.title;const p=document.createElement('p');p.textContent=n.body;const meta=document.createElement('small');meta.textContent='প্রতিবেদক: '+n.author+' | ফোন: '+(n.phone||'দেওয়া হয়নি')+' | অবস্থা: '+n.status;const actions=document.createElement('div');actions.className='actions';if(n.status!=='approved'){const ok=document.createElement('button');ok.textContent='অনুমোদন ও প্রকাশ';ok.onclick=()=>act(n.id,'approve');actions.append(ok);}const reject=document.createElement('button');reject.textContent='বাতিল';reject.className='secondary';reject.onclick=()=>act(n.id,'reject');const del=document.createElement('button');del.textContent='ডিলিট';del.className='danger';del.onclick=()=>{if(confirm('এই নিউজ স্থায়ীভাবে ডিলিট করবেন?'))act(n.id,'delete')};actions.append(reject,del);c.append(h,p,meta,actions);el.append(c);}}
async function act(id,action){const opts=action==='delete'?{method:'DELETE'}:{method:'POST'};await fetch('/api/admin/news/'+id+(action==='delete'?'':'/'+action),opts);load();}load();
</script></body></html>
