
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123524">
  <title>অ্যাডমিন ড্যাশবোর্ড | সত্যের সন্ধানে সব সময়</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f3;
      margin: 0;
      color: #17251c;
    }
    .admin-wrap {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }
    .admin-header {
      background: #123524;
      color: white;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #00000010;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      cursor: pointer;
    }
    .button {
      border: 0;
      background: #176b3a;
      color: white;
      padding: 11px 16px;
      border-radius: 7px;
      margin: 5px;
      font-size: 14px;
    }
    .button.outline {
      background: #b7791f;
    }
    .button.danger {
      background: #b42318;
    }
    .tabs, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0;
    }
    .tab.active {
      background: #123524;
    }
    .admin-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
      background: white;
    }
    .admin-card h3 {
      margin-top: 0;
    }
    .admin-card p {
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .error {
      color: #b42318;
      font-weight: bold;
    }
    .success {
      color: #176b3a;
      font-weight: bold;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="admin-wrap">

    <header class="admin-header">
      <h1>সত্যের সন্ধানে সব সময়</h1>
      <p>অ্যাডমিন ড্যাশবোর্ড</p>
    </header>

    <section id="loginPanel" class="panel">
      <h2>অ্যাডমিন লগইন</h2>

      <form id="loginForm">
        <label for="email">ইমেইল</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="আপনার অ্যাডমিন ইমেইল"
          required
        >

        <label for="password">পাসওয়ার্ড</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="আপনার পাসওয়ার্ড"
          required
        >

        <button class="button" type="submit">
          লগইন করুন
        </button>
      </form>

      <p id="loginMsg" aria-live="polite"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="panel">
        <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
        <p>লগইন করা হয়েছে: <strong id="who"></strong></p>
        <button id="logout" class="button danger" type="button">
          লগআউট
        </button>
      </div>

      <section class="panel">
        <h2>✍️ নতুন নিউজ প্রকাশ করুন</h2>
        <form id="adminNewsForm">
          <label for="adminTitle">নিউজের শিরোনাম</label>
          <input id="adminTitle" name="title" minlength="5" maxlength="180" required>
          <label for="adminAuthor">প্রতিনিধির নাম</label>
          <input id="adminAuthor" name="author" minlength="2" maxlength="80" required>
          <label for="adminPhone">মোবাইল নম্বর (ঐচ্ছিক)</label>
          <input id="adminPhone" name="phone" maxlength="30">
          <label for="adminImage">ছবির লিংক (ঐচ্ছিক)</label>
          <input id="adminImage" name="image_url" type="url" placeholder="https://...">
          <label for="adminImageFile">অথবা মোবাইল/কম্পিউটার থেকে ছবি আপলোড করুন (ঐচ্ছিক, সর্বোচ্চ ৫ MB)</label>
          <input id="adminImageFile" name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <label for="adminVideoUrl">YouTube ভিডিও লিংক (ঐচ্ছিক)</label>
          <input id="adminVideoUrl" name="video_url" type="url" placeholder="https://www.youtube.com/watch?v=...">
          <small>YouTube ভিডিওর Share → Copy link থেকে লিংক দিন।
          <label for="adminBody">নিউজের বিস্তারিত</label>
          <textarea id="adminBody" name="body" minlength="20" maxlength="12000" required rows="8" style="display:block;width:100%;box-sizing:border-box;padding:13px;margin:12px 0;border:1px solid #ccc;border-radius:7px;font-size:16px;"></textarea>
          <button class="button" type="submit">সরাসরি প্রকাশ করুন</button>
          <p id="adminPublishMsg" aria-live="polite"></p>
        </form>
      </section>

      <div class="panel">
        <div class="tabs">
          <button class="button tab active" data-status="pending" type="button">
            অনুমোদনের অপেক্ষায়
          </button>
          <button class="button tab" data-status="approved" type="button">
            প্রকাশিত
          </button>
          <button class="button tab" data-status="rejected" type="button">
            বাতিল
          </button>
        </div>

        <div id="adminNews">
          লোড হচ্ছে...
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js?v=20261123-delete-button-1"></script>
</body>
</html>
