<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন প্যানেল — সত্যের সন্ধানে</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="container head"><a class="logo" href="index.html">সত্যের সন্ধানে <span>সব সময়</span><small>অ্যাডমিন প্যানেল</small></a><a class="admin-link" href="index.html">ওয়েবসাইট দেখুন</a></div></header>
<main class="container admin-main"><section id="loginPanel" class="panel narrow"><span class="eyebrow dark">নিরাপদ প্রবেশ</span><h1>অ্যাডমিন লগইন</h1><p class="muted">Supabase Auth-এ তৈরি করা অ্যাডমিন ইমেইল ও পাসওয়ার্ড ব্যবহার করুন।</p><form id="loginForm"><label>ইমেইল<input type="email" name="email" required autocomplete="username"></label><label>পাসওয়ার্ড<input type="password" name="password" required autocomplete="current-password"></label><button class="button">লগইন</button><p id="loginMsg" role="status"></p></form></section>
<section id="dashboard" hidden><div class="dashhead"><div><span class="eyebrow dark">নিউজ নিয়ন্ত্রণ</span><h1>অ্যাডমিন ড্যাশবোর্ড</h1><p id="who" class="muted"></p></div><button id="logout" class="button outline">লগআউট</button></div><div class="tabs"><button class="tab active" data-status="pending">অনুমোদনের অপেক্ষায়</button><button class="tab" data-status="approved">প্রকাশিত</button><button class="tab" data-status="rejected">বাতিল</button></div><div id="adminNews" class="admin-list">লোড হচ্ছে...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2""></script><script src="config.js"></script><script src="admin.js"></script></body></html>
