<script>
const form=document.querySelector("#reporterApplyForm");
const msg=document.querySelector("#applyMessage");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=form.querySelector("button");
 const d=Object.fromEntries(new FormData(form));
 const file=document.querySelector("#reporterPhoto").files[0];
 if(!file){msg.textContent="আপনার ছবি নির্বাচন করুন।";return;}
 if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>3*1024*1024){msg.textContent="JPG, PNG বা WEBP ছবি দিন; সর্বোচ্চ ৩ MB।";return;}
 btn.disabled=true;msg.textContent="আবেদন জমা হচ্ছে...";
 try{
  const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file);});
  const response=await fetch("/api/submit-reporter-application",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name:d.full_name,phone:d.phone,email:d.email,address:d.address,reporter_post:d.reporter_post,citizenship_country:d.citizenship_country,is_expatriate:d.is_expatriate,current_country:d.current_country,photo_base64:base64,photo_type:file.type})});
  const result=await response.json();
  if(!response.ok||!result.ok)throw new Error(result.error||"আবেদন জমা হয়নি।");
  form.reset();msg.textContent="আপনার আবেদন সফলভাবে জমা হয়েছে। অ্যাডমিন যাচাই করে সিদ্ধান্ত জানাবেন।";
 }catch(err){msg.textContent="সমস্যা: "+err.message;}finally{btn.disabled=false;}
});
</script>
